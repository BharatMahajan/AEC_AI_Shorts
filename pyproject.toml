[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aec-ai-shorts"
version = "0.1.0"
description = "Loop-engineered automatic YouTube Shorts pipeline for AI in the AEC industry"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pipeline"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

# Pin the lint rule set explicitly. Without this, "ruff check" falls back to
# whatever rules the installed ruff version defaults to -- and ruff has
# expanded its default rule set over time. requirements-dev.txt floors ruff
# at ">=0.5.0" with no upper bound and no lockfile, so CI always installs the
# latest release; a newer default ruleset silently started failing this
# codebase (dozens of UP/BLE/PIE/etc findings) even though nothing here
# changed, which blocked the "test" job -> blocked "publish" -> silently
# stopped the daily-short pipeline from ever uploading. E4/E7/E9/F is the
# baseline this codebase was written and is kept clean against.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
